name: Local Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out Mem Reduct
        uses: actions/checkout@v4
        with:
          path: memreduct

      - name: Check out build dependencies
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/henrypp/routine.git routine
          git -C routine fetch --depth 1 origin 3020ca94007b824c387ce145a6ff22702dc22272
          git -C routine checkout 3020ca94007b824c387ce145a6ff22702dc22272
          git clone --depth 1 https://github.com/henrypp/builder.git builder

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 executable
        shell: pwsh
        run: |
          msbuild memreduct\memreduct.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143

      - name: Build ARM64 executable
        shell: pwsh
        run: |
          msbuild memreduct\memreduct.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:PlatformToolset=v143

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build unsigned installer
        shell: pwsh
        run: |
          $version = '3.6.0'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'memreduct-package'
          $installerSource = Join-Path (Resolve-Path 'builder\src') 'memreduct-3.6.0-setup.exe'
          $payload64 = Join-Path $packageRoot '64'
          $payloadArm64 = Join-Path $packageRoot 'ARM64'
          $binary64 = Get-ChildItem memreduct\bin\64 -Filter memreduct.exe -Recurse | Select-Object -First 1
          $binaryArm64 = Get-ChildItem memreduct\bin\ARM64 -Filter memreduct.exe -Recurse | Select-Object -First 1
          if (-not $binary64 -or -not $binaryArm64) { throw 'MSBuild did not produce both architecture binaries.' }
          foreach ($payload in @($payload64, $payloadArm64)) {
            New-Item -ItemType Directory -Path $payload -Force | Out-Null
            Copy-Item memreduct\bin\History.txt $payload
            Copy-Item memreduct\bin\Readme.txt $payload
            Copy-Item memreduct\bin\License.txt $payload
            Copy-Item memreduct\bin\memreduct.lng $payload
            Set-Content -Path (Join-Path $payload 'portable.dat') -Value '#PORTABLE#' -NoNewline
          }
          Copy-Item $binary64.FullName (Join-Path $payload64 'memreduct.exe')
          Copy-Item $binaryArm64.FullName (Join-Path $payloadArm64 'memreduct.exe')

          $defines = @(
            "/DAPP_NAME=Mem Reduct"
            "/DAPP_NAME_SHORT=memreduct"
            "/DAPP_VERSION=$version"
            "/DAPP_FILES_DIR=$packageRoot"
            "/XOutFile memreduct-3.6.0-setup.exe"
          )
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" @defines builder\src\setup_script.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $installerSource)) { throw 'NSIS did not produce an installer.' }
          Move-Item $installerSource memreduct\memreduct-3.6.0-setup.exe -Force

          Compress-Archive -Path "$packageRoot\*" -DestinationPath memreduct\memreduct-3.6.0-portable.zip

      - name: Upload local build
        uses: actions/upload-artifact@v4
        with:
          name: memreduct-3.6.0-local
          path: |
            memreduct/bin/**/memreduct.exe
            memreduct/memreduct-3.6.0-setup.exe
            memreduct/memreduct-3.6.0-portable.zip
          if-no-files-found: error
          retention-days: 7
